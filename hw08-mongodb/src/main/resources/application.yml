spring:
  shell:
    command:
      version:
        enabled: false

  data:
    mongodb:
      port: 0 # when flapdoodle using
      database: books

  aop:
    proxy-target-class: false

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.5

mongock:
  #runner-type: "ApplicationRunner" # default
  runner-type: "InitializingBean"
  change-logs-scan-package:
    - ru.otus.hw.changelog
  mongo-db:
    write-concern:
      journal: false
    read-concern: local
