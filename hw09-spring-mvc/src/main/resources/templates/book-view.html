<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Book detail info</title>
    <style type="text/css">
        body {
            padding: 50px;
        }

        .books {
            border: 1px solid steelblue;
            width: 300px;
            border-collapse: collapse;
        }

        .books tr td, th {
            padding: 5px;
            border: 1px solid steelblue;
        }

        .books td:last-child, td:first-child {
            width: 50px;
        }

        h3 {
            background-image: url("../static/listmark.png");
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }

    </style>

    <style type="text/css" th:inline="text">
        [[h3]] {
            background-image: url([[@{/listmark.png}]]);
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }

    </style>
</head>
<body>

<nav>
    <a th:href="@{/books}">Books</a>
    <a th:href="@{/authors}">Authors</a>
    <a th:href="@{/genres}">Genres</a>
    <a th:href="@{/comments}">Comments</a>
</nav>

<h3>Book detail info:</h3>

<table class="books">
    <tbody>
    <tr>
        <td>ID</td>
        <td th:text="${book.id}">1</td>
    </tr>
    <tr>
        <td>Title</td>
        <td th:text="${book.title}">John Doe</td>
    </tr>
    <tr>
        <td>Author</td>
        <td th:text="${book.author.fullName}">1</td>
    </tr>
    <tr>
        <td>Genres</td>
        <td>
                <span th:each="genre : ${book.genres}">
                    <span th:text="${genre.name}">Genre</span>
                </span>
        </td>
    </tr>
    <tr>
        <td>Comments</td>
        <td>
                <span th:each="comment : ${comments}">
                    <span th:text="${comment.text}">Genre</span>
                </span>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
