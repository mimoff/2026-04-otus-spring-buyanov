<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Edit book</title>
    <style type="text/css">
        body {
            padding: 50px;
        }

        label {
            display: inline-block;
            width: 100px;
        }

        input:read-only {
            background: lightgray;
        }

        .row {
            margin-top: 10px;
        }

        h3 {
            background-image: url("../static/listmark.png");
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }

        .errors {
            color: red;
        }
    </style>

    <style type="text/css" th:inline="text">
        [[h3]] {
            background-image: url([[@{/listmark.png}]]);
            background-repeat: no-repeat;
            padding: 2px;
            padding-left: 30px;
        }
    </style>
</head>
<body>

<!-- Book edition -->
<form id="edit-form" action="book-edit.html" th:action="@{/books/edit(id=${book.id})}" th:method="post" th:object="${book}">
    <h3>Book Info:</h3>

    <div class="row">
        <label for="id-input">ID:</label>
        <input id="id-input" type="text" readonly="readonly" name="id" th:value="*{id}" value="1"/>
    </div>

    <div class="row">
        <label for="book-title-input" >Title:</label>
        <input id="book-title-input" name="title" type="text" th:value="*{title}" value="John Doe"/>
        <div class="errors" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Wrong book title error</div>
    </div>

    <!--div class="row">
        <label for="book-hobby-select" th:text="#{book-field-hobby} + ':'">Hobby:</label>
        <select id="book-hobby-select" name="hobby" multiple>
            <option value="Fishing" th:selected="*{hobby.contains('Fishing')}">Fishing</option>
            <option value="Poetry" th:selected="*{hobby.contains('Poetry')}">Poetry</option>
            <option value="Traveling" th:selected="*{hobby.contains('Traveling')}">Traveling</option>
        </select>
    </div-->

    <div class="row">
        <label for="authorId">Author</label>
        <select id="authorId" th:field="*{authorId}" required>
            <option value="">Select an author</option>
            <option th:each="author : ${authors}"
                    th:value="${author.id}"
                    th:text="${author.fullName}">
                Author
            </option>
        </select>
    </div>

    <div class="row">
        <label for="genreIds">Genres</label>
        <select id="genreIds" th:field="*{genreIds}" multiple required>
            <option th:each="genre : ${genres}"
                    th:value="${genre.id}"
                    th:text="${genre.name}">
                Genre
            </option>
        </select>
    </div>

    <div class="row">
        <button type="submit">Save</button>
        <a href="book-list.html" th:href="@{/}"><button type="button">Cancel</button></a>
    </div>
</form>

</body>
</html>
